[z0]
legend = { "#" = "t_wall", "." = "t_floor", "D" = "t_door_c", "O" = "t_door_o", "W" = "t_window", "," = "t_grass", "R" = "t_pavement", "T" = "f_table", "B" = "f_board_map" }
