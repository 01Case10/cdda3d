# street_block — the S2 outside/inside workhorse (plan §4 item 4,
# reduced to what S2 needs): a roofed house on grass with a road
# strip, 24x24 = 2x2 submaps, so walking out of the house and
# east across x=12 crosses a submap boundary (a map shift: fresh
# Snapshot, epoch + 1).
#
# House: walls x 2..9 / y 2..8, floor interior, window at (4,2),
# closed door at (5,8) in the south wall. The player starts
# inside at (5,5): step south twice, bump the closed door
# (blocked), `o` + south to open it, step out onto the grass,
# walk east past x=12, come back, `c` + south to close it.
# Road: t_pavement strip at x 20..21. Trees are decoration.
name = "street_block"
seed = 1
time = "noon"
weather = "clear"
player = [5, 5, 0]
environment = true

[z0]
legend = { "#" = "t_wall", "." = "t_floor", "D" = "t_door_c", "W" = "t_window", "," = "t_grass", "R" = "t_pavement", "Y" = "t_tree", "T" = "f_table" }
map = [
