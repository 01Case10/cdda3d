  "XXXXXXXXXXXX",
  "X##########X",
  "X#....#...#X",
  "X#....#...#X",
  "X#..^.#...#X",
  "X#....D...#X",
  "X###D##...#X",
  "X#....#...#X",
  "X#....#...#X",
  "X#....#...#X",
  "X##########X",
