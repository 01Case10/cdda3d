# stub_house — the canonical Phase 1 house (plan §4 item 1).
# Reproduces proto::samples::sample_snapshot() semantically:
# wall perimeter, door at (5,11), window at (2,0), a table, a
# two-field tile, an item pile, one zombie, one vehicle.
# The sample carries NO avatar entity (its only entity is the
# zombie, id 1), so this scene has no `player` key and no player
# spawn. The sample piggybacks the environment and carries
# outside[] — both enabled here.
name = "stub_house"
seed = 1
time = "noon"
weather = "clear"
view_origin = [0, 0, 0]
view_radius = 60
environment = true
emit_outside = true

[z0]
legend = { "#" = "t_wall", "." = "t_floor", "D" = "t_door_c", "W" = "t_window", "T" = "f_table" }
