  "X#########XX",
  "XXXXXXXXXXXX",
  "XXXXXXXXXXXX",
]

[z0]
legend = { "#" = "t_wall", "." = "t_floor", "D" = "t_door_c", "v" = "t_stairs_down", "^" = "t_stairs_up", "," = "t_grass" }
