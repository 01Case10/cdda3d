[[spawn]]
type = "player"
pos = [5, 5, 0]
hp_frac = 255
facing = "NONE"

# The T3 zombie, standing in the open yard south-east of the
# house where the chase plays out in the open (no walls to
# stall the greedy chase in a local minimum).
[[spawn]]
type = "mon_zombie"
pos = [12, 11, 0]

[[light]]
pos = [12, 9, 0]
color = [1.0, 0.6, 0.2]
intensity = 6.0

[[carried]]
type = "rock"
count = 3

[[carried]]
type = "stick"
count = 1
