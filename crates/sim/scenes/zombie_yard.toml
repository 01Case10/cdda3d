# zombie_yard — street_block plus a zombie already in the yard
# (S7 support scene). Process-mode scenarios cannot use the
# `spawn` step (a client cannot inject world events over the
# wire), so the T3 process-mode twin authors its zombie into
# the scene instead. Everything else is street_block verbatim:
# same house, door at (5,8), streetlamp at (12,9), carried
# rock x3 + stick.
name = "zombie_yard"
seed = 1
time = "noon"
weather = "clear"
player = [5, 5, 0]
environment = true

[z0]
legend = { "#" = "t_wall", "." = "t_floor", "D" = "t_door_c", "W" = "t_window", "," = "t_grass", "R" = "t_pavement", "Y" = "t_tree", "T" = "f_table" }
