# T11 — vehicles (plan §6 T11; behaviour proved by the S6
# gate). The destructible_street store car (id 1, origin
# (17,5,0), face 23.0 deg, 13 parts): absolute part positions
# follow the faithful precalc/coord_translate port — at 23 deg
# the (1,-1) wheel lands on the origin's own tile offset; a
# scripted rotate to exactly 90 deg maps mount (x,y) -> (-y,x)
# with the roof part (mount (0,0)) unmoved; a translate shifts
# every part rigidly; damage walks hp_frac to broken; removal
# takes the part off the wire. In-process only: vehicle
# mutation steps are world events (a client receives vehicle
# updates; it cannot cause them).
scene = "destructible_street"
name = "T11 vehicles: rotate, translate, damage, remove"

steps = [
  { assert_vehicle_face = { vehicle = 1, face_deg = 23.0 } },
  { assert_vehicle_part = { vehicle = 1, part = "wheel", mount = [1, -1, 0], pos = [18, 4, 0] } },
  { do = "rotate_vehicle", vehicle = 1, face_deg = 90.0 },
  { assert_vehicle_face = { vehicle = 1, face_deg = 90.0 } },
  { assert_vehicle_part = { vehicle = 1, part = "wheel", mount = [1, -1, 0], pos = [18, 6, 0] } },
  { assert_vehicle_part = { vehicle = 1, part = "roof", mount = [0, 0, 0], pos = [17, 5, 0], roof = true } },
  { do = "translate_vehicle", vehicle = 1, delta = [3, -2, 0] },
  { assert_vehicle_part = { vehicle = 1, part = "frame", mount = [0, 0, 0], pos = [20, 3, 0] } },
  { do = "damage_vehicle_part", vehicle = 1, part = "door", mount = [0, -1, 0], amount = 100 },
  { assert_vehicle_part = { vehicle = 1, part = "door", mount = [0, -1, 0], hp_frac = 155, broken = false } },
  { do = "damage_vehicle_part", vehicle = 1, part = "door", mount = [0, -1, 0], amount = 200 },
  { assert_vehicle_part = { vehicle = 1, part = "door", mount = [0, -1, 0], hp_frac = 0, broken = true } },
  { do = "remove_vehicle_part", vehicle = 1, part = "wheel", mount = [1, -1, 0] },
  { assert_vehicle_part_absent = { vehicle = 1, part = "wheel", mount = [1, -1, 0] } },
  { assert_mirror = true },
]
