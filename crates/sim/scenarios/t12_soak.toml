# T12 — soak / invariant (plan §6 T12). GREEN in S8, as a
# scripted slice of the real thing.
#
# T12's full form — the seeded random-input soak, 1,100
# turns x 10 seeds with the mirror invariant and a hash
# compare after every Delta — is a GATE, not a scenario:
# it lives in crates/sim/tests/soak_gate.rs (S8), because
# the scenario DSL has no seeded key generator. This file
# is the deterministic skeleton that soak wraps, in the
# green set so the DSL itself exercises the shape: a long
# run of turns on street_block with the invariant checked
# after every step by the runner (and explicitly at the
# end). The S7 sketch's 10,000 polite waits are replaced
# by 200: the runner's per-step mirror check over 10,000
# steps is pure repetition of the soak gate's stronger
# per-Delta hash check, at gate-suite runtime cost.
scene = "street_block"
name = "T12 soak (scripted slice; the seeded soak is soak_gate.rs)"

steps = [
  { do = "advance_turns", count = 200 },
  { assert_mirror = true },
]
