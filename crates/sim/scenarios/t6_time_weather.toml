# T6 — time and weather (plan §6 T6; behaviour proved by the
# S3 gate). A 24 h sweep in two advance_time steps (not 86,400
# key steps): noon -> midnight -> noon, with a storm in the
# middle. Sun altitude flips sign at the horizon crossings;
# the weather preset and its wire id both assert.
scene = "street_block"
name = "T6 time and weather"

steps = [
  { assert_env = { weather = "clear", sun_altitude_gt = 0.0 } },
  { do = "advance_time", minutes = 720 },
  { assert_env = { weather = "clear", sun_altitude_lt = 0.0 } },
  { do = "set_weather", name = "storm" },
  { assert_env = { weather = "storm", weather_id = "weather_thunderstorm" } },
  { do = "advance_time", minutes = 720 },
  { assert_env = { sun_altitude_gt = 0.0 } },
  { do = "set_weather", name = "clear" },
  { assert_env = { weather = "clear", weather_id = "weather_clear" } },
  { assert_mirror = true },
]
