[package]
name = "treebuild"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDDA Voxel Frontend Phase 2c: world -> Sparse-Voxel-64Tree builder, material side-table, CPU traversal oracle, WGSL ray tracer."

[dependencies]
mesher = { path = "../mesher" }
Sparse-Voxel-64Tree = "=0.1.0"
glam = "0.29"
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
pollster = "0.4"
