[package]
name = "fx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDDA Voxel Frontend Phase 2b: shader field effects + HD-2D post stack (renderer-agnostic, wgpu)."

[dependencies]
wgpu = "24"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
