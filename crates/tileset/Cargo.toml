[package]
name = "tileset"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDDA tileset loader: decomposed per-sprite entries + composed tile_config.json, tile_info.json sheet geometry, and the game's sprite resolution chain (Phase 5)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
