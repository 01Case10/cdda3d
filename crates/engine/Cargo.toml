[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDDA Voxel Frontend engine: winit + wgpu window, camera, z-cutaway, fake-data world (Phase 2 MVP)."

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "voxel-engine"
path = "src/main.rs"

[dependencies]
mesher = { path = "../mesher" }
treebuild = { path = "../treebuild" }
glam = "0.29"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
