[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CDDA Voxel Frontend engine: winit + wgpu window, camera, z-cutaway, fake-data world (Phase 2 MVP)."

[lib]
name = "engine"
path = "src/lib.rs"

[[bin]]
name = "voxel-engine"
path = "src/main.rs"

[dependencies]
mesher = { path = "../mesher" }
treebuild = { path = "../treebuild" }
fx = { path = "../fx" }
proto = { path = "../proto" }
ui-share = { path = "../ui-share" }
billboard = { path = "../billboard" }
lighting = { path = "../lighting" }
vehicles = { path = "../vehicles" }
transient = { path = "../transient" }
hardcases = { path = "../hardcases" }
glam = "0.29"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
# Phase 10 slice 10.3 gate: validate the composed WGSL sources
# (shared sky WGSL + raster bodies) with wgpu's own shader
# frontend on machines with no wgpu adapter, where the GPU
# shader compile cannot run. Same naga major as wgpu 24's.
naga = { version = "24", features = ["wgsl-in"] }
# Stage F gate: build v1/v2 asset sets from the voxelizer fixture
# tileset in-process.
voxelizer = { path = "../voxelizer" }
tileset = { path = "../tileset" }
# Phase 11 S1 gate (sim_world_parity_gate): build sim scenes
# in-process and compare their wire-ingested worlds against the
# proto sample fixtures.
sim = { path = "../sim" }
